name: auto_pooling_driver
description: "Auto Pooling Driver application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  auto_route: ^11.1.0
  dartz: ^0.10.1
  equatable: ^2.0.8
  flutter_svg: ^2.2.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  auto_route_generator: ^10.5.0
  flutter_gen_runner: ^5.13.0+1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true
