$kind: collection
name: Auto Pooling API
description: |-
  API collection for the Auto Pooling car-sharing backend service.
  
  ## Base URL
  - Local: http://localhost:4000
  
  ## Authentication
  Protected endpoints require Bearer token in Authorization header.
  Obtain tokens via the verify-otp endpoint.
variables:
  - key: baseUrl
    value: 'http://localhost:4000'
    description: Base URL for the API server
