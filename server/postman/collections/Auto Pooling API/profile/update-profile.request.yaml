$kind: http-request
name: 'update profile'
method: PATCH
url: '{{baseUrl}}/v1/profile'
order: 2000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "name": "Updated Name",
      "email": "user@example.com",
      "gender": "male"
    }
