$kind: http-request
name: 'delete user'
method: DELETE
url: '{{baseUrl}}/v1/auth/delete/user'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "userId": "user-uuid-here"
    }
