$kind: http-request
name: Profile / Edit Rider User (POST)
description: |-
  Updates rider profile fields using the legacy POST variant.

  - Requires a rider bearer token.
  - Send any subset of rider profile fields.
url: "{{baseUrl}}/v1/profile/rider/edit-user"
method: POST
headers:
  Authorization: Bearer {{riderAccessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Rider Updated",
      "gender": "other"
    }
examples: ./.resources/Profile - Edit Rider User (POST).resources/examples
order: 10000
