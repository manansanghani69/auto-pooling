$kind: http-example
request:
  url: "{{baseUrl}}/v1/profile/rider/create-user"
  method: POST
  headers:
    Authorization: Bearer {{riderAccessToken}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "Rider Name",
        "email": "rider@example.com",
        "gender": "male",
        "photo_link": "https://example.com/rider.jpg"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "status": "error",
        "code": 403,
        "data": null,
        "error": {
          "message": "forbidden"
        }
      }
order: 2000
