$kind: http-example
request:
  url: "{{baseUrl}}/v1/driver-location"
  method: PATCH
  headers:
    Authorization: Bearer {{driverAccessToken}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "longitude": "72.5714",
        "latitude": "23.0225"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "status": "success",
        "code": 200,
        "data": {
          "driverLocation": {
            "driverId": "6ca92f0d-9cb9-424f-be26-4b70445e276f",
            "longitude": "72.5714",
            "latitude": "23.0225"
          }
        }
      }
order: 4000
