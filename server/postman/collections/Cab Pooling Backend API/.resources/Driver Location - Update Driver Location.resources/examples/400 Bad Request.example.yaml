$kind: http-example
request:
  url: "{{baseUrl}}/v1/driver-location"
  method: PATCH
  headers:
    Authorization: Bearer {{driverAccessToken}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "longitude": "72.5714",
        "latitude": "23.0225"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "status": "error",
        "code": 400,
        "data": null,
        "error": {
          "message": "validation error",
          "details": [
            {
              "field": "location",
              "message": "location is required"
            }
          ]
        }
      }
order: 2000
