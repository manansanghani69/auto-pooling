$kind: http-example
request:
  url: "{{baseUrl}}/v1/request-trip/rider/request-ride"
  method: PATCH
  headers:
    Authorization: Bearer {{riderAccessToken}}
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "pickupLongitude": "72.5714",
        "pickupLatitude": "23.0225",
        "dropoffLongitude": "72.6290",
        "dropoffLatitude": "23.0657"
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "status": "error",
        "code": 503,
        "data": null,
        "error": {
          "message": "driver-location service unavailable"
        }
      }
order: 6000
