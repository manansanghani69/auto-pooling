$kind: http-example
request:
  url: "{{baseUrl}}/v1/auth/refresh"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "status": "error",
        "code": 401,
        "data": null,
        "error": {
          "message": "invalid refresh token"
        }
      }
order: 2000
