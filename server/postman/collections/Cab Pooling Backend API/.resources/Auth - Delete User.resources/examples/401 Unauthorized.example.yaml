$kind: http-example
request:
  url: "{{baseUrl}}/v1/auth/delete/user"
  method: DELETE
  headers:
    Authorization: Bearer {{accessToken}}
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "status": "error",
        "code": 401,
        "data": null,
        "error": {
          "message": "missing auth header"
        }
      }
order: 2000
