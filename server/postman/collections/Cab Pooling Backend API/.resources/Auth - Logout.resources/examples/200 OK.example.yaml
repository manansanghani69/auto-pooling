$kind: http-example
request:
  url: "{{baseUrl}}/v1/auth/logout"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "status": "success",
        "code": 200,
        "data": {
          "ok": true
        }
      }
order: 1000
