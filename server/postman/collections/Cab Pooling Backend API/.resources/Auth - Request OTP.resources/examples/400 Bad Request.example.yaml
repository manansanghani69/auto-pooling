$kind: http-example
request:
  url: "{{baseUrl}}/v1/auth/request-otp"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "phone": "{{phone}}"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "status": "error",
        "code": 400,
        "data": null,
        "error": {
          "message": "phone required"
        }
      }
order: 2000
