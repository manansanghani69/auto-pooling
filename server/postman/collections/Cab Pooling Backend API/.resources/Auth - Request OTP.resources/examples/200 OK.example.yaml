$kind: http-example
request:
  url: "{{baseUrl}}/v1/auth/request-otp"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "phone": "{{phone}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "status": "success",
        "code": 200,
        "data": {
          "ok": true,
          "expiresIn": 300,
          "otp": "1234"
        }
      }
order: 1000
