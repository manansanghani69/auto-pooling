$kind: http-request
name: Driver Location / Update Driver Location
description: |-
  Updates the authenticated driver location.

  - Requires a driver bearer token.
  - Body fields: `longitude` and `latitude` as numeric strings.
  - Coordinates are validated for range and written to Redis GEO cache.
url: "{{baseUrl}}/v1/driver-location"
method: PATCH
headers:
  Authorization: Bearer {{driverAccessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "longitude": "72.5714",
      "latitude": "23.0225"
    }
examples: ./.resources/Driver Location - Update Driver Location.resources/examples
order: 17000
